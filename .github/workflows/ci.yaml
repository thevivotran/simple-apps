name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 20 * * 0" # weekly rebuild picks up python base-image security patches
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
      - run: ruff format --check .
      - run: python -m unittest discover -s tests -t . -v

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=main-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/thevivotran/simple-apps:${{ steps.tag.outputs.tag }}
